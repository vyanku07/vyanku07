<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img"
     aria-label="Animated developer terminal"
     font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace">
  <title>~/developer — live banner</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset=".55" stop-color="#080d1a"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset=".35" stop-color="#38bdf8"/>
      <stop offset=".7" stop-color="#fbbf24"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="gc" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".15"/><stop offset="1" stop-opacity="0" stop-color="#38bdf8"/>
    </radialGradient>
    <radialGradient id="gg" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34d399" stop-opacity=".12"/><stop offset="1" stop-opacity="0" stop-color="#34d399"/>
    </radialGradient>
    <radialGradient id="core" cx=".35" cy=".35" r=".85">
      <stop offset="0" stop-color="#f0fdfa"/><stop offset=".45" stop-color="#67e8f9"/><stop offset="1" stop-color="#0e7490"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#14203a"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>

    <!-- typing reveals: discrete width steps = real typewriter effect -->
    <clipPath id="t1"><rect x="86" y="120" height="26" width="86">
      <animate attributeName="width" calcMode="discrete" dur="12s" repeatCount="indefinite"
        values="0;0;10;20;30;40;50;60;70;80;86;86;0"
        keyTimes="0;.03;.04;.05;.06;.07;.08;.085;.09;.095;.10;.95;1"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="86" y="184" height="26" width="132">
      <animate attributeName="width" calcMode="discrete" dur="12s" repeatCount="indefinite"
        values="0;0;10;20;31;41;51;61;72;82;92;102;112;122;132;132;0"
        keyTimes="0;.22;.228;.236;.244;.252;.26;.268;.276;.284;.292;.30;.308;.316;.32;.95;1"/>
    </rect></clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)" opacity=".5"/>
  <ellipse cx="340" cy="180" rx="420" ry="180" fill="url(#gc)"/>
  <ellipse cx="960" cy="150" rx="330" ry="160" fill="url(#gg)"/>
  <rect width="1200" height="2" fill="#38bdf8" opacity=".07">
    <animate attributeName="y" values="-4;344" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- drifting glyphs -->
  <g font-size="22">
    <g fill="#34d399" opacity=".35"><text x="696" y="88">{ }</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="9s" repeatCount="indefinite"/></g>
    <g fill="#38bdf8" opacity=".3"><text x="1164" y="92" text-anchor="end">&lt;/&gt;</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="11s" repeatCount="indefinite"/></g>
    <g fill="#fbbf24" opacity=".3"><text x="688" y="300">=&gt;</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="8s" repeatCount="indefinite"/></g>
    <g fill="#a78bfa" opacity=".3"><text x="1164" y="252" text-anchor="end">λ</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="10s" repeatCount="indefinite"/></g>
  </g>

  <!-- twinkles -->
  <circle cx="800" cy="70" r="1.5" fill="#7dd3fc"><animate attributeName="opacity" values=".1;.9;.1" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="1078" cy="120" r="1.5" fill="#a7f3d0"><animate attributeName="opacity" values=".1;.9;.1" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="985" cy="298" r="1.5" fill="#fde68a"><animate attributeName="opacity" values=".1;.9;.1" dur="5s" repeatCount="indefinite"/></circle>

  <!-- ══ terminal ══ -->
  <rect x="70" y="86" width="560" height="212" rx="14" fill="#000" opacity=".45" filter="url(#soft)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="7s"
      repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <rect x="64" y="64" width="560" height="212" rx="12" fill="#0b1526" stroke="#1f2b45"/>
    <rect x="64" y="64" width="560" height="34" rx="12" fill="#101c33"/>
    <rect x="64" y="86" width="560" height="12" fill="#101c33"/>
    <line x1="64" y1="98.5" x2="624" y2="98.5" stroke="#223457"/>
    <circle cx="88" cy="81" r="6" fill="#f87171"/><circle cx="110" cy="81" r="6" fill="#fbbf24"/><circle cx="132" cy="81" r="6" fill="#34d399"/>
    <text x="344" y="86" text-anchor="middle" font-size="13" fill="#5b6c8f">you@github: ~</text>

    <g font-size="16">
      <text x="86" y="138" clip-path="url(#t1)"><tspan fill="#34d399">$</tspan><tspan fill="#e2e8f0"> whoami</tspan></text>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.125;.15;.95;1" dur="12s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0;0 0;0 6" keyTimes="0;.125;.15;.95;1" dur="12s" repeatCount="indefinite"/>
        <text x="98" y="170" fill="#7dd3fc">→ creative developer who ships ⚡</text>
      </g>

      <text x="86" y="202" clip-path="url(#t3)"><tspan fill="#34d399">$</tspan><tspan fill="#e2e8f0"> cat now.txt</tspan></text>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.34;.37;.95;1" dur="12s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 6;0 6;0 0;0 0;0 6" keyTimes="0;.34;.37;.95;1" dur="12s" repeatCount="indefinite"/>
        <text x="98" y="234" fill="#7dd3fc">→ building AI tools · open source · this profile</text>
      </g>

      <rect x="86" y="246" width="10" height="20" fill="#34d399">
        <animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;.5" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ══ atom / orbits ══ -->
  <g transform="translate(930 168)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="18s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <g stroke="#26375c" fill="none" opacity=".9">
        <ellipse rx="130" ry="48" transform="rotate(-18)"/>
        <ellipse rx="95" ry="34" transform="rotate(42)"/>
        <ellipse rx="58" ry="20" transform="rotate(84)"/>
      </g>
      <g transform="rotate(-18)"><g><animateMotion dur="8s" repeatCount="indefinite"
          path="M-130 0 A130 48 0 1 1 130 0 A130 48 0 1 1 -130 0"/>
        <circle r="9" fill="#34d399" opacity=".25"/><circle r="4.5" fill="#34d399"/></g></g>
      <g transform="rotate(42)"><g><animateMotion dur="6s" repeatCount="indefinite"
          path="M95 0 A95 34 0 1 0 -95 0 A95 34 0 1 0 95 0"/>
        <circle r="8" fill="#38bdf8" opacity=".25"/><circle r="4" fill="#38bdf8"/></g></g>
      <g transform="rotate(84)"><g><animateMotion dur="4.6s" repeatCount="indefinite"
          path="M-58 0 A58 20 0 1 1 58 0 A58 20 0 1 1 -58 0"/>
        <circle r="7" fill="#fbbf24" opacity=".25"/><circle r="3.5" fill="#fbbf24"/></g></g>
      <circle r="24" fill="none" stroke="#22d3ee" stroke-width="1.5">
        <animate attributeName="r" values="16;34" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;0" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="15" fill="url(#core)">
        <animate attributeName="r" values="14;17;14" dur="3.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- status + chrome -->
  <g>
    <rect x="962" y="282" width="182" height="34" rx="17" fill="#0b1a14" stroke="#1f4636"/>
    <circle cx="984" cy="299" r="4" fill="#34d399">
      <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1000" y="304" font-size="12" letter-spacing="2.5" fill="#86efac">OPEN TO COLLAB</text>
  </g>
  <text x="1164" y="46" text-anchor="end" font-size="12" fill="#64748b">[ build: <tspan fill="#fbbf24">passing</tspan> ]</text>
  <text x="64" y="310" font-size="12" fill="#3f4f70">// pure SVG · SMIL-animated · zero JS · edit me in assets/banner.svg</text>

  <!-- marching gradient frame -->
  <rect x="9" y="9" width="1182" height="322" rx="20" fill="none" stroke="#16233c"/>
  <rect x="9" y="9" width="1182" height="322" rx="20" fill="none" stroke="url(#frame)"
        stroke-width="1.6" stroke-dasharray="14 22" opacity=".85">
    <animate attributeName="stroke-dashoffset" from="0" to="-144" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
